name: Real-world migration report
description: Share a reproducible result from testing PkgLift on an Xcode project.
title: "[Migration report]: "
labels:
  - help wanted
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing PkgLift on a real project.

        Please remove secrets, private repository names, customer information, signing identities, and proprietary source code before submitting. Successful, partial, and unsuccessful migrations are all useful.

        `pkglift diagnostics --path . --output pkglift-diagnostics.json` can create a minimized local report. Open and review the JSON before attaching it. PkgLift never uploads it automatically.

  - type: input
    id: pkglift_version
    attributes:
      label: PkgLift version
      description: Run `pkglift version` and paste the result.
      placeholder: 0.2.1
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include macOS, Xcode, Swift, and CocoaPods versions.
      placeholder: macOS 15.6, Xcode 16.4, Swift 6.1, CocoaPods 1.16.2
    validations:
      required: true

  - type: dropdown
    id: project_shape
    attributes:
      label: Project shape
      options:
        - Single Xcode project
        - Workspace with one project
        - Workspace with multiple projects
        - Project generated by another tool
        - Other
    validations:
      required: true

  - type: dropdown
    id: consumer_languages
    attributes:
      label: Consumer target source languages
      description: Choose the PBX source profile reported for the target that consumes the dependency.
      options:
        - Swift only
        - Objective-C only
        - Mixed Swift and Objective-C
        - C, C++, or Objective-C++ present
        - Incomplete or unknown profile
    validations:
      required: true

  - type: checkboxes
    id: integrations
    attributes:
      label: Other dependency integrations detected
      description: Select every integration present in the project, even if PkgLift correctly refused AUTO.
      options:
        - label: Carthage
        - label: React Native (`use_react_native!`)
        - label: Flutter (`flutter_install_all_ios_pods`)
        - label: Capacitor (`capacitor_pods`)
        - label: Kotlin Multiplatform or another generated integration
        - label: None of these

  - type: checkboxes
    id: commands
    attributes:
      label: Commands exercised
      description: Select every command used during the test.
      options:
        - label: "`pkglift analyze`"
        - label: "`pkglift plan`"
        - label: "`pkglift migrate` (dry run)"
        - label: "`pkglift migrate --apply`"
        - label: "`pkglift verify`"
        - label: "`pkglift verify --build`"
        - label: "`pkglift diagnostics`"

  - type: textarea
    id: dependency_summary
    attributes:
      label: Dependency and classification summary
      description: List relevant pod identifiers and their AUTO, REVIEW, BLOCKED, or UNKNOWN classifications. Do not include private package names unless you are comfortable publishing them.
      placeholder: |
        Alamofire 5.9.1 — AUTO
        InternalAnalytics — UNKNOWN (name redacted)
    validations:
      required: true

  - type: textarea
    id: expected_outcome
    attributes:
      label: Expected outcome
      description: What did you expect PkgLift to analyze, preserve, migrate, or verify?
    validations:
      required: true

  - type: textarea
    id: actual_outcome
    attributes:
      label: Actual outcome
      description: Describe what happened, including whether the project remained unchanged during analysis and dry run and whether the final build passed.
    validations:
      required: true

  - type: textarea
    id: redacted_output
    attributes:
      label: Relevant redacted output
      description: Paste the smallest useful CLI output or error. Remove paths, tokens, signing data, customer names, and proprietary identifiers.
      render: shell

  - type: textarea
    id: diagnostics_report
    attributes:
      label: Reviewed diagnostics report
      description: Optional. Drag the reviewed `pkglift-diagnostics.json` file here, or paste only the relevant minimized fields. Do not attach it without opening and reviewing it first.
      placeholder: Attach the reviewed JSON file or explain why no diagnostics report is available.

  - type: input
    id: reproduction
    attributes:
      label: Public reproduction or project link
      description: Optional. Link only to material you are authorized to share.
      placeholder: https://github.com/example/project

  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I tested on a clean Git worktree, disposable branch, or copy of the project.
          required: true
        - label: If a plan was generated, I reviewed it before applying any changes.
          required: true
        - label: I removed secrets and proprietary information from this report and any attached diagnostics or portable JSON.
          required: true
