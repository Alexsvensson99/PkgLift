name: G3 Multi-Target Qualification

# Deliberately separate from ordinary CI and the ten read-only upstream pilots.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g3-multi-target-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build_pilot_toolchain:
    name: Build reviewed G3 toolchain
    runs-on: macos-15
    timeout-minutes: 35
    outputs:
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_run_attempt: ${{ steps.package.outputs.artifact_run_attempt }}
      binary_sha256: ${{ steps.package.outputs.binary_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check exact source and environment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          [[ "$(uname -m)" == arm64 ]]
          [[ "$(sw_vers -productVersion)" == 15.* ]]
          [[ "$(xcodebuild -version | head -n 1)" == 'Xcode 16.4' ]]
      - name: Validate harness before upstream work
        run: |
          ruby Scripts/validate-repository-yaml.rb
          python3 -m unittest discover -s Tests/ReleaseManifestTests -p 'test_*.py'
      - name: Build immutable PkgLift artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release -j 2 --arch arm64
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          bin_directory="$(swift build -c release --arch arm64 --show-bin-path)"
          bash Scripts/package-pilot-artifact.sh "$bin_directory" "$RUNNER_TEMP/pkglift-pilot-artifact"
      - name: Upload verified toolchain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/pkglift-pilot-artifact/pkglift-pilot-binary.tar.gz
            ${{ runner.temp }}/pkglift-pilot-artifact/pkglift-pilot-binary.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  refusal_controls:
    name: G3 refusal (${{ matrix.case }})
    needs: build_pilot_toolchain
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: [firebaseui-project, hammerspoon-workspace]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build_pilot_toolchain.outputs.artifact_name }}
          path: ${{ runner.temp }}/pkglift-pilot-artifact
      - name: Verify same-run toolchain
        env:
          PKGLIFT_EXPECTED_ARCHIVE_SHA256: ${{ needs.build_pilot_toolchain.outputs.archive_sha256 }}
          PKGLIFT_EXPECTED_BINARY_SHA256: ${{ needs.build_pilot_toolchain.outputs.binary_sha256 }}
          PKGLIFT_EXPECTED_PRODUCER_ATTEMPT: ${{ needs.build_pilot_toolchain.outputs.artifact_run_attempt }}
          PKGLIFT_EXPECTED_REPOSITORY: ${{ github.repository }}
          PKGLIFT_EXPECTED_RUN_ID: ${{ github.run_id }}
          PKGLIFT_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: >-
          python3 Scripts/verify-pilot-artifact.py
          "$RUNNER_TEMP/pkglift-pilot-artifact/pkglift-pilot-binary.tar.gz"
          "$RUNNER_TEMP/pkglift-pilot-runtime"
      - name: Analyze, plan and prove mutation-free refusal
        env:
          G3_CASE: ${{ matrix.case }}
        run: >-
          python3 Scripts/run-real-project-refusal.py --case "$G3_CASE"
          --pkglift "$PKGLIFT_BIN" --output "$RUNNER_TEMP/pkglift-g3-refusal"
      - name: Upload portable refusal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkglift-g3-${{ matrix.case }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkglift-g3-refusal/report
          if-no-files-found: warn
          retention-days: 14

  zb_multi_target:
    name: G3 ZBNetworking sibling-preserving migration
    needs: [build_pilot_toolchain, refusal_controls]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build_pilot_toolchain.outputs.artifact_name }}
          path: ${{ runner.temp }}/pkglift-pilot-artifact
      - name: Verify same-run toolchain
        env:
          PKGLIFT_EXPECTED_ARCHIVE_SHA256: ${{ needs.build_pilot_toolchain.outputs.archive_sha256 }}
          PKGLIFT_EXPECTED_BINARY_SHA256: ${{ needs.build_pilot_toolchain.outputs.binary_sha256 }}
          PKGLIFT_EXPECTED_PRODUCER_ATTEMPT: ${{ needs.build_pilot_toolchain.outputs.artifact_run_attempt }}
          PKGLIFT_EXPECTED_REPOSITORY: ${{ github.repository }}
          PKGLIFT_EXPECTED_RUN_ID: ${{ github.run_id }}
          PKGLIFT_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: >-
          python3 Scripts/verify-pilot-artifact.py
          "$RUNNER_TEMP/pkglift-pilot-artifact/pkglift-pilot-binary.tar.gz"
          "$RUNNER_TEMP/pkglift-pilot-runtime"
      - name: Require reviewed dependency tooling
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(pod --version)" == 1.17.0 ]]
          [[ "$(uname -m)" == arm64 ]]
          [[ "$(sw_vers -productVersion)" == 15.* ]]
          [[ "$(xcodebuild -version | head -n 1)" == 'Xcode 16.4' ]]
      - name: Run the reviewed multi-target protocol
        run: >-
          python3 Scripts/run-real-project-zb.py --pkglift "$PKGLIFT_BIN"
          --output "$RUNNER_TEMP/pkglift-g3-zb" --jobs 2
      - name: Upload portable multi-target evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkglift-g3-zb-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkglift-g3-zb/report
          if-no-files-found: warn
          retention-days: 14

  qualification_gate:
    name: G3 multi-target gate
    if: always()
    needs: [build_pilot_toolchain, refusal_controls, zb_multi_target]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected case
        env:
          BUILD_RESULT: ${{ needs.build_pilot_toolchain.result }}
          REFUSAL_RESULT: ${{ needs.refusal_controls.result }}
          ZB_RESULT: ${{ needs.zb_multi_target.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RESULT" == success ]]
          [[ "$REFUSAL_RESULT" == success ]]
          [[ "$ZB_RESULT" == success ]]
          echo 'Selected multi-target G3 case passed. iOS 15 compilation only; no runtime or complete 1.0 claim.'
