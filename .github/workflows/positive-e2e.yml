name: Mixed-Language End-to-End Pilot

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Mixed-Language Pilot Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Detect mixed-language-pilot changes
        id: filter
        env:
          PKGLIFT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PKGLIFT_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          relevant="$(python3 Scripts/ci-paths-relevant.py \
            '.github/workflows/positive-e2e.yml' \
            'Scripts/run-positive-e2e-pilot.sh' \
            'Scripts/hash-pilot-tree.py' \
            'Scripts/run-with-timeout.py' \
            'Scripts/ci-paths-relevant.py' \
            'Fixtures/MixedLanguageSDWebImage/**' \
            'Documentation/Pilots.md' \
            'Package.swift' \
            'Package.resolved' \
            'Registry/S/SDWebImage.yml' \
            'Sources/PkgLiftCLI/**' \
            'Sources/PkgLiftCore/**' \
            'Sources/PkgLiftCocoaPods/**' \
            'Sources/PkgLiftMigration/**' \
            'Sources/PkgLiftRegistry/**' \
            'Sources/PkgLiftVerification/**' \
            'Sources/PkgLiftXcode/**')"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  migrate-and-build:
    name: Mixed-Language Migration and Build
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build PkgLift
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release -j 2
          bin_directory="$(swift build -c release --show-bin-path)"
          echo "PKGLIFT_BIN=$bin_directory/pkglift" >> "$GITHUB_ENV"

      - name: Run Mixed-Language End-to-End Pilot
        run: bash Scripts/run-positive-e2e-pilot.sh

      - name: Upload Pilot Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkglift-positive-e2e-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pkglift-positive-e2e-report/summary.md
            ${{ runner.temp }}/pkglift-positive-e2e-report/environment.txt
            ${{ runner.temp }}/pkglift-positive-e2e-report/source.txt
            ${{ runner.temp }}/pkglift-positive-e2e-report/hashes.txt
            ${{ runner.temp }}/pkglift-positive-e2e-report/analysis.json
            ${{ runner.temp }}/pkglift-positive-e2e-report/plan.json
            ${{ runner.temp }}/pkglift-positive-e2e-report/dry-run.txt
            ${{ runner.temp }}/pkglift-positive-e2e-report/apply.txt
            ${{ runner.temp }}/pkglift-positive-e2e-report/verification.json
            ${{ runner.temp }}/pkglift-positive-e2e-report/verification.stderr.txt
            ${{ runner.temp }}/pkglift-positive-e2e-report/schemes.stderr.txt
            ${{ runner.temp }}/pkglift-positive-e2e-report/baseline-lockfile.txt
            ${{ runner.temp }}/pkglift-positive-e2e-report/baseline-pod-install.log
            ${{ runner.temp }}/pkglift-positive-e2e-report/migration-baseline-pod-install.log
            ${{ runner.temp }}/pkglift-positive-e2e-report/migrated-pod-install.log
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: Mixed-Language Pilot Gate
    needs: [changes, migrate-and-build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require applicable mixed-language pilot
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          PILOT_RESULT: ${{ needs.migrate-and-build.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == 'success' ]]
          if [[ "$RELEVANT" == 'true' ]]; then
            [[ "$PILOT_RESULT" == 'success' ]]
            echo 'The mixed-language end-to-end pilot passed.'
          else
            [[ "$PILOT_RESULT" == 'skipped' ]]
            echo 'No mixed-language-pilot changes; the heavy pilot was safely skipped.'
          fi
