name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Swift Version
        run: swift --version
      - name: Test
        run: swift test
      - name: Validate Registry
        run: swift run pkglift registry validate
      - name: Build Release
        run: swift build -c release
      - name: Create Archive
        run: |
          mkdir -p release
          cp .build/release/pkglift release/
          cd release
          tar -czf pkglift-macos-arm64.tar.gz pkglift
          shasum -a 256 pkglift-macos-arm64.tar.gz > pkglift-macos-arm64.tar.gz.sha256
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/pkglift-macos-arm64.tar.gz
            release/pkglift-macos-arm64.tar.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
