name: Release
on:
  workflow_dispatch:

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: distribution-signing
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.distribution_archive.outputs.archive_sha256 }}
      binary_sha256: ${{ steps.signing_identity.outputs.binary_sha256 }}
      registry_bundle_sha256: ${{ steps.signing_identity.outputs.registry_bundle_sha256 }}
      version: ${{ steps.version_contract.outputs.version }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate Distribution Secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_TEAM_ID \
            DEVELOPER_ID_APPLICATION_IDENTITY \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            NOTARY_ISSUER_ID \
            NOTARY_KEY_ID \
            NOTARY_KEY_P8_BASE64
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required distribution secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Swift Version
        run: swift --version

      - name: Test
        run: swift test -j 2

      - name: Validate Registry
        run: swift run -j 2 pkglift registry validate

      - name: Build Release
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release -j 2 --arch arm64
          release_bin_directory="$(swift build -c release --arch arm64 --show-bin-path)"
          echo "PKGLIFT_RELEASE_BIN_DIR=$release_bin_directory" >> "$GITHUB_ENV"

      - name: Validate Version Contract
        id: version_contract
        shell: bash
        run: |
          set -euo pipefail
          version="$("$PKGLIFT_RELEASE_BIN_DIR/pkglift" version)"
          echo "PKGLIFT_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID Certificate
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/pkglift-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/pkglift-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          keychain_password="$(uuidgen)$(uuidgen)"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "$DEVELOPER_ID_APPLICATION_IDENTITY"

          echo "PKGLIFT_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "PKGLIFT_NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"

      - name: Sign Release Binary
        id: signing_identity
        shell: bash
        run: |
          set -euo pipefail
          binary_path="$PKGLIFT_RELEASE_BIN_DIR/pkglift"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$DEVELOPER_ID_APPLICATION_IDENTITY" \
            --keychain "$PKGLIFT_KEYCHAIN_PATH" \
            "$binary_path"
          codesign --verify --strict --verbose=4 "$binary_path"
          codesign -dvvv "$binary_path" 2> "$RUNNER_TEMP/codesign-details.txt"
          cat "$RUNNER_TEMP/codesign-details.txt"
          grep -F "Authority=$DEVELOPER_ID_APPLICATION_IDENTITY" "$RUNNER_TEMP/codesign-details.txt"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/codesign-details.txt"
          grep -E 'flags=.*runtime' "$RUNNER_TEMP/codesign-details.txt"
          grep -E '^Timestamp=' "$RUNNER_TEMP/codesign-details.txt"
          signed_binary_sha256="$(shasum -a 256 "$binary_path" | awk '{print $1}')"
          registry_bundle_sha256="$(
            python3 Scripts/hash-pilot-tree.py \
              "$PKGLIFT_RELEASE_BIN_DIR/PkgLift_PkgLiftRegistry.bundle"
          )"
          echo "PKGLIFT_SIGNED_BINARY_SHA256=$signed_binary_sha256" >> "$GITHUB_ENV"
          echo "PKGLIFT_REGISTRY_BUNDLE_SHA256=$registry_bundle_sha256" >> "$GITHUB_ENV"
          echo "binary_sha256=$signed_binary_sha256" >> "$GITHUB_OUTPUT"
          echo "registry_bundle_sha256=$registry_bundle_sha256" >> "$GITHUB_OUTPUT"

      - name: Create Distribution Archives
        id: distribution_archive
        env:
          PKGLIFT_ARCH: arm64
          PKGLIFT_REQUIRE_DEVELOPER_ID: '1'
          PKGLIFT_EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/package-release.sh release release
          archive_sha256="$(shasum -a 256 release/pkglift-macos-arm64.tar.gz | awk '{print $1}')"
          (
            cd release
            shasum -a 256 --check pkglift-macos-arm64.tar.gz.sha256
          )
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Notarize Distribution
        id: notarize
        shell: bash
        run: |
          set -euo pipefail
          result_path="$RUNNER_TEMP/notary-result.json"
          log_path="$RUNNER_TEMP/notary-log.json"
          set +e
          xcrun notarytool submit \
            release/pkglift-macos-arm64-notarization.zip \
            --key "$PKGLIFT_NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$result_path"
          submit_status=$?
          set -e
          [[ ! -f "$result_path" ]] || cat "$result_path"

          if [[ ! -s "$result_path" ]]; then
            echo "Notary service returned no result document (exit $submit_status)." >&2
            exit 1
          fi

          status="$(plutil -extract status raw -o - "$result_path")"
          submission_id="$(plutil -extract id raw -o - "$result_path")"
          echo "submission-id=$submission_id" >> "$GITHUB_OUTPUT"
          if [[ $submit_status -ne 0 || "$status" != "Accepted" ]]; then
            xcrun notarytool log "$submission_id" \
              --key "$PKGLIFT_NOTARY_KEY_PATH" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              "$log_path" || true
            [[ ! -f "$log_path" ]] || cat "$log_path"
            echo "Notarization returned status $status (exit $submit_status)." >&2
            exit 1
          fi

      - name: Verify Quarantined CLI
        shell: bash
        run: |
          set -euo pipefail
          assessment_directory="$(mktemp -d)"
          trap 'rm -rf "$assessment_directory"' EXIT
          tar -xzf release/pkglift-macos-arm64.tar.gz -C "$assessment_directory"
          binary_path="$assessment_directory/pkglift"
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");GitHubActions;" "$binary_path"
          codesign --verify --strict --verbose=4 "$binary_path"
          codesign -dvvv "$binary_path" 2> "$assessment_directory/codesign-details.txt"
          cat "$assessment_directory/codesign-details.txt"
          grep -F "Authority=$DEVELOPER_ID_APPLICATION_IDENTITY" "$assessment_directory/codesign-details.txt"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" "$assessment_directory/codesign-details.txt"
          grep -E 'flags=.*runtime' "$assessment_directory/codesign-details.txt"
          grep -E '^Timestamp=' "$assessment_directory/codesign-details.txt"

          set +e
          assessment_output="$(spctl --assess --type execute --verbose=4 "$binary_path" 2>&1)"
          assessment_status=$?
          set -e
          printf '%s\n' "$assessment_output"

          if (( assessment_status == 0 )); then
            grep -F 'source=Notarized Developer ID' <<< "$assessment_output"
          else
            # spctl does not classify a standalone Mach-O command-line tool as
            # an app. Accept only that exact classification after notarytool
            # returned Accepted and the strict signature check passed.
            [[ $assessment_status -eq 3 ]]
            grep -F 'rejected (the code is valid but does not seem to be an app)' <<< "$assessment_output"
          fi

          [[ "$("$binary_path" version)" == "$PKGLIFT_VERSION" ]]
          "$binary_path" registry validate

      - name: Upload Validated Distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkglift-macos-arm64-${{ github.sha }}
          path: |
            release/pkglift-macos-arm64.tar.gz
            release/pkglift-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Notarization Diagnostics
        if: failure() && steps.notarize.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkglift-notarization-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/notary-result.json
            ${{ runner.temp }}/notary-log.json
          if-no-files-found: warn
          retention-days: 14

      - name: Clean Signing Material
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${PKGLIFT_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$PKGLIFT_KEYCHAIN_PATH"
          fi
          rm -f \
            "$RUNNER_TEMP/pkglift-developer-id.p12" \
            "$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"

  acceptance:
    name: Signed candidate consumer acceptance
    needs: package
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Exact Signed Candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkglift-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/pkglift-release-acceptance-input

      - name: Stage Exact Signed Candidate for Workflow Acceptance
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/pkglift-release-acceptance-input/pkglift-macos-arm64.tar.gz"
          archive_sha256="$(shasum -a 256 "$archive_path" | awk '{print $1}')"
          [[ "$archive_sha256" == "${{ needs.package.outputs.archive_sha256 }}" ]]

          acceptance_root="$(mktemp -d "$RUNNER_TEMP/pkglift-release-acceptance.XXXXXX")"
          candidate_root="$acceptance_root/candidate"
          evidence_root="$acceptance_root/evidence"
          mkdir "$candidate_root" "$evidence_root"
          tar -xzf "$archive_path" -C "$candidate_root"

          binary_path="$candidate_root/pkglift"
          bundle_path="$candidate_root/PkgLift_PkgLiftRegistry.bundle"
          [[ -x "$binary_path" && ! -L "$binary_path" ]]
          [[ -d "$bundle_path" && ! -L "$bundle_path" ]]
          [[ -z "$(find "$bundle_path" -type l -print -quit)" ]]

          candidate_binary_sha256="$(shasum -a 256 "$binary_path" | awk '{print $1}')"
          candidate_bundle_sha256="$(python3 Scripts/hash-pilot-tree.py "$bundle_path")"
          [[ "$candidate_binary_sha256" == "${{ needs.package.outputs.binary_sha256 }}" ]]
          [[ "$candidate_bundle_sha256" == "${{ needs.package.outputs.registry_bundle_sha256 }}" ]]
          codesign --verify --strict --verbose=4 "$binary_path"
          xattr -w com.apple.quarantine \
            "0083;$(printf '%x' "$(date +%s)");GitHubActionsReleaseAcceptance;" \
            "$binary_path"

          cat > "$candidate_root/manifest.txt" <<EOF
          schema=1
          repository=$GITHUB_REPOSITORY
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          producer_run_attempt=$GITHUB_RUN_ATTEMPT
          producer_job=package
          runner_arch=$(uname -m)
          archive_sha256=$archive_sha256
          binary_sha256=$candidate_binary_sha256
          bundle_sha256=$candidate_bundle_sha256
          EOF

          python3 Scripts/capture-environment.py > "$evidence_root/environment.json"
          {
            echo "PKGLIFT_RELEASE_ACCEPTANCE_ROOT=$acceptance_root"
            echo "PKGLIFT_RELEASE_ACCEPTANCE_BIN=$binary_path"
            echo "PKGLIFT_ARTIFACT_SOURCE_SHA=$GITHUB_SHA"
            echo "PKGLIFT_ARTIFACT_RUN_ID=$GITHUB_RUN_ID"
            echo "PKGLIFT_ARTIFACT_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "PKGLIFT_ARCHIVE_SHA256=$archive_sha256"
            echo "PKGLIFT_BINARY_SHA256=$candidate_binary_sha256"
          } >> "$GITHUB_ENV"

      - name: Accept Signed Candidate Full Migration
        env:
          PKGLIFT_BIN: ${{ env.PKGLIFT_RELEASE_ACCEPTANCE_BIN }}
        run: bash Scripts/run-positive-e2e-pilot.sh

      - name: Accept Signed Candidate Partial Migration
        run: >-
          python3 Scripts/run-partial-migration-pilot.py
          --case PartialMixed
          --output "$RUNNER_TEMP/pkglift-release-partial"
          --pkglift "$PKGLIFT_RELEASE_ACCEPTANCE_BIN"
          --jobs 2

      - name: Accept Signed Candidate Conservative Refusal
        run: >-
          python3 Scripts/run-real-project-refusal.py
          --case hammerspoon-workspace
          --pkglift "$PKGLIFT_RELEASE_ACCEPTANCE_BIN"
          --output "$RUNNER_TEMP/pkglift-release-refusal"

      - name: Collect Signed Candidate Acceptance Evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$PKGLIFT_RELEASE_ACCEPTANCE_ROOT/evidence"
          cp -R "$RUNNER_TEMP/pkglift-positive-e2e-report" "$evidence_root/full-migration"
          cp -R "$RUNNER_TEMP/pkglift-release-partial/report" "$evidence_root/partial-migration"
          cp -R "$RUNNER_TEMP/pkglift-release-refusal/report" "$evidence_root/conservative-refusal"
          cat > "$evidence_root/candidate-identity.txt" <<EOF
          repository=$GITHUB_REPOSITORY
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          archive_sha256=$PKGLIFT_ARCHIVE_SHA256
          binary_sha256=$PKGLIFT_BINARY_SHA256
          registry_bundle_sha256=${{ needs.package.outputs.registry_bundle_sha256 }}
          EOF

      - name: Upload Signed Candidate Acceptance Evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkglift-release-acceptance-${{ github.sha }}
          path: ${{ env.PKGLIFT_RELEASE_ACCEPTANCE_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 14

  runtime-macos14:
    name: Signed candidate runtime (macOS 14)
    needs: package
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Exact Signed Candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkglift-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/pkglift-release-runtime-input

      - name: Accept Signed Candidate on Observed macOS 14 Host
        run: >-
          python3 Scripts/verify-candidate-runtime.py
          --archive "$RUNNER_TEMP/pkglift-release-runtime-input/pkglift-macos-arm64.tar.gz"
          --archive-sha256 "${{ needs.package.outputs.archive_sha256 }}"
          --binary-sha256 "${{ needs.package.outputs.binary_sha256 }}"
          --source-commit "${{ github.sha }}"
          --version "${{ needs.package.outputs.version }}"
          --required-macos-major 14
          --fixture Fixtures/MixedLanguageSDWebImage
          --output-dir "$RUNNER_TEMP/pkglift-release-runtime-evidence"

      - name: Upload macOS 14 Runtime Evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkglift-release-runtime-macos14-${{ github.sha }}
          path: ${{ runner.temp }}/pkglift-release-runtime-evidence
          if-no-files-found: error
          retention-days: 14
