name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: distribution-signing
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate Source Ref
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit already contained in origin/main." >&2
            exit 1
          fi

      - name: Validate Distribution Secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_TEAM_ID \
            DEVELOPER_ID_APPLICATION_IDENTITY \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            NOTARY_ISSUER_ID \
            NOTARY_KEY_ID \
            NOTARY_KEY_P8_BASE64
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required distribution secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Swift Version
        run: swift --version

      - name: Test
        run: swift test -j 2

      - name: Validate Registry
        run: swift run -j 2 pkglift registry validate

      - name: Build Release
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release -j 2 --arch arm64
          release_bin_directory="$(swift build -c release --arch arm64 --show-bin-path)"
          echo "PKGLIFT_RELEASE_BIN_DIR=$release_bin_directory" >> "$GITHUB_ENV"

      - name: Validate Version Contract
        shell: bash
        run: |
          set -euo pipefail
          version="$("$PKGLIFT_RELEASE_BIN_DIR/pkglift" version)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" && "$GITHUB_REF_NAME" != v"$version"-* ]]; then
            echo "Tag $GITHUB_REF_NAME does not match CLI version $version." >&2
            exit 1
          fi
          echo "PKGLIFT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Import Developer ID Certificate
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/pkglift-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/pkglift-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          keychain_password="$(uuidgen)$(uuidgen)"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "$DEVELOPER_ID_APPLICATION_IDENTITY"

          echo "PKGLIFT_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "PKGLIFT_NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"

      - name: Sign Release Binary
        shell: bash
        run: |
          set -euo pipefail
          binary_path="$PKGLIFT_RELEASE_BIN_DIR/pkglift"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$DEVELOPER_ID_APPLICATION_IDENTITY" \
            --keychain "$PKGLIFT_KEYCHAIN_PATH" \
            "$binary_path"
          codesign --verify --strict --verbose=4 "$binary_path"
          codesign -dvvv "$binary_path" 2> "$RUNNER_TEMP/codesign-details.txt"
          cat "$RUNNER_TEMP/codesign-details.txt"
          grep -F "Authority=$DEVELOPER_ID_APPLICATION_IDENTITY" "$RUNNER_TEMP/codesign-details.txt"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/codesign-details.txt"
          grep -E 'flags=.*runtime' "$RUNNER_TEMP/codesign-details.txt"
          grep -E '^Timestamp=' "$RUNNER_TEMP/codesign-details.txt"

      - name: Create Distribution Archives
        env:
          PKGLIFT_ARCH: arm64
          PKGLIFT_REQUIRE_DEVELOPER_ID: '1'
          PKGLIFT_EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash Scripts/package-release.sh release release

      - name: Notarize Distribution
        id: notarize
        shell: bash
        run: |
          set -euo pipefail
          result_path="$RUNNER_TEMP/notary-result.json"
          log_path="$RUNNER_TEMP/notary-log.json"
          set +e
          xcrun notarytool submit \
            release/pkglift-macos-arm64-notarization.zip \
            --key "$PKGLIFT_NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$result_path"
          submit_status=$?
          set -e
          [[ ! -f "$result_path" ]] || cat "$result_path"

          if [[ ! -s "$result_path" ]]; then
            echo "Notary service returned no result document (exit $submit_status)." >&2
            exit 1
          fi

          status="$(plutil -extract status raw -o - "$result_path")"
          submission_id="$(plutil -extract id raw -o - "$result_path")"
          echo "submission-id=$submission_id" >> "$GITHUB_OUTPUT"
          if [[ $submit_status -ne 0 || "$status" != "Accepted" ]]; then
            xcrun notarytool log "$submission_id" \
              --key "$PKGLIFT_NOTARY_KEY_PATH" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              "$log_path" || true
            [[ ! -f "$log_path" ]] || cat "$log_path"
            echo "Notarization returned status $status (exit $submit_status)." >&2
            exit 1
          fi

      - name: Verify Gatekeeper Assessment
        shell: bash
        run: |
          set -euo pipefail
          assessment_directory="$(mktemp -d)"
          trap 'rm -rf "$assessment_directory"' EXIT
          tar -xzf release/pkglift-macos-arm64.tar.gz -C "$assessment_directory"
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");GitHubActions;" "$assessment_directory/pkglift"
          spctl --assess --type execute --verbose=4 "$assessment_directory/pkglift"

      - name: Upload Validated Distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkglift-macos-arm64-${{ github.sha }}
          path: |
            release/pkglift-macos-arm64.tar.gz
            release/pkglift-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Notarization Diagnostics
        if: failure() && steps.notarize.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkglift-notarization-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/notary-result.json
            ${{ runner.temp }}/notary-log.json
          if-no-files-found: warn
          retention-days: 14

      - name: Clean Signing Material
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${PKGLIFT_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$PKGLIFT_KEYCHAIN_PATH"
          fi
          rm -f \
            "$RUNNER_TEMP/pkglift-developer-id.p12" \
            "$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: macos-15
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: Download Validated Distribution
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pkglift-macos-arm64-${{ github.sha }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            release/pkglift-macos-arm64.tar.gz
            release/pkglift-macos-arm64.tar.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
