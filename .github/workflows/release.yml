name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/releases/v*.json'
  workflow_dispatch:

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: distribution-signing
    permissions:
      contents: read
    outputs:
      publish_release: ${{ steps.release_context.outputs.publish_release }}
      release_tag: ${{ steps.release_context.outputs.release_tag }}
      target_commitish: ${{ steps.release_context.outputs.target_commitish }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve Release Context
        id: release_context
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          publish_release=false
          release_tag=''
          target_commitish="$GITHUB_SHA"

          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            release_tag="$GITHUB_REF_NAME"
            publish_release=true
          elif [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == 'refs/heads/main' ]]; then
            if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              echo 'A release-manifest push must have a concrete previous main commit.' >&2
              exit 1
            fi

            mapfile -t manifests < <(
              git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- '.github/releases/v*.json'
            )
            if (( ${#manifests[@]} != 1 )); then
              echo "Expected exactly one changed release manifest; found ${#manifests[@]}." >&2
              printf '  %s\n' "${manifests[@]:-<none>}" >&2
              exit 1
            fi

            manifest="${manifests[0]}"
            version="$(/usr/bin/python3 - "$manifest" <<'PY'
import json
import re
import sys

path = sys.argv[1]
with open(path, encoding="utf-8") as handle:
    document = json.load(handle)

if document.get("schemaVersion") != 1:
    raise SystemExit("Release manifest schemaVersion must be 1")
version = document.get("version")
if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", version):
    raise SystemExit("Release manifest version is invalid")
print(version)
PY
            )"

            release_tag="v$version"
            expected_manifest=".github/releases/$release_tag.json"
            if [[ "$manifest" != "$expected_manifest" ]]; then
              echo "Manifest path must be $expected_manifest, not $manifest." >&2
              exit 1
            fi

            source_version="$(
              sed -n 's/.*pkgLiftVersion = "\([^"]*\)".*/\1/p' \
                Sources/PkgLiftCore/Version.swift
            )"
            if [[ "$source_version" != "$version" ]]; then
              echo "Manifest version $version does not match source version $source_version." >&2
              exit 1
            fi
            if ! grep -F "## [$version] -" CHANGELOG.md >/dev/null; then
              echo "CHANGELOG.md has no dated $version release heading." >&2
              exit 1
            fi
            if git show-ref --verify --quiet "refs/tags/$release_tag"; then
              existing_target="$(git rev-list -n 1 "$release_tag")"
              echo "Tag $release_tag already exists at $existing_target; refusing duplicate publication." >&2
              exit 1
            fi

            publish_release=true
          fi

          printf 'publish_release=%s\n' "$publish_release" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'target_commitish=%s\n' "$target_commitish" >> "$GITHUB_OUTPUT"

          {
            echo '### Release context'
            echo
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo "- Target commit: \`$target_commitish\`"
            echo "- Public release requested: \`$publish_release\`"
            if [[ -n "$release_tag" ]]; then
              echo "- Release tag: \`$release_tag\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Source Ref
        if: steps.release_context.outputs.publish_release == 'true'
        shell: bash
        env:
          TARGET_COMMITISH: ${{ steps.release_context.outputs.target_commitish }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$TARGET_COMMITISH" origin/main; then
            echo "Public release target must already be contained in origin/main." >&2
            exit 1
          fi

      - name: Validate Distribution Secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_TEAM_ID \
            DEVELOPER_ID_APPLICATION_IDENTITY \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            NOTARY_ISSUER_ID \
            NOTARY_KEY_ID \
            NOTARY_KEY_P8_BASE64
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required distribution secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Swift Version
        run: swift --version

      - name: Test
        run: swift test -j 2

      - name: Validate Registry
        run: swift run -j 2 pkglift registry validate

      - name: Build Release
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release -j 2 --arch arm64
          release_bin_directory="$(swift build -c release --arch arm64 --show-bin-path)"
          echo "PKGLIFT_RELEASE_BIN_DIR=$release_bin_directory" >> "$GITHUB_ENV"

      - name: Validate Version Contract
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_context.outputs.release_tag }}
        run: |
          set -euo pipefail
          version="$("$PKGLIFT_RELEASE_BIN_DIR/pkglift" version)"
          if [[ -n "$RELEASE_TAG" ]]; then
            case "$RELEASE_TAG" in
              "v$version"|"v$version"-*) ;;
              *)
                echo "Release tag $RELEASE_TAG does not match CLI version $version." >&2
                exit 1
                ;;
            esac
          fi
          echo "PKGLIFT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Import Developer ID Certificate
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/pkglift-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/pkglift-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          keychain_password="$(uuidgen)$(uuidgen)"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "$DEVELOPER_ID_APPLICATION_IDENTITY"

          echo "PKGLIFT_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "PKGLIFT_NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"

      - name: Sign Release Binary
        shell: bash
        run: |
          set -euo pipefail
          binary_path="$PKGLIFT_RELEASE_BIN_DIR/pkglift"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$DEVELOPER_ID_APPLICATION_IDENTITY" \
            --keychain "$PKGLIFT_KEYCHAIN_PATH" \
            "$binary_path"
          codesign --verify --strict --verbose=4 "$binary_path"
          codesign -dvvv "$binary_path" 2> "$RUNNER_TEMP/codesign-details.txt"
          cat "$RUNNER_TEMP/codesign-details.txt"
          grep -F "Authority=$DEVELOPER_ID_APPLICATION_IDENTITY" "$RUNNER_TEMP/codesign-details.txt"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/codesign-details.txt"
          grep -E 'flags=.*runtime' "$RUNNER_TEMP/codesign-details.txt"
          grep -E '^Timestamp=' "$RUNNER_TEMP/codesign-details.txt"

      - name: Create Distribution Archives
        env:
          PKGLIFT_ARCH: arm64
          PKGLIFT_REQUIRE_DEVELOPER_ID: '1'
          PKGLIFT_EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash Scripts/package-release.sh release release

      - name: Notarize Distribution
        id: notarize
        shell: bash
        run: |
          set -euo pipefail
          result_path="$RUNNER_TEMP/notary-result.json"
          log_path="$RUNNER_TEMP/notary-log.json"
          set +e
          xcrun notarytool submit \
            release/pkglift-macos-arm64-notarization.zip \
            --key "$PKGLIFT_NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$result_path"
          submit_status=$?
          set -e
          [[ ! -f "$result_path" ]] || cat "$result_path"

          if [[ ! -s "$result_path" ]]; then
            echo "Notary service returned no result document (exit $submit_status)." >&2
            exit 1
          fi

          status="$(plutil -extract status raw -o - "$result_path")"
          submission_id="$(plutil -extract id raw -o - "$result_path")"
          echo "submission-id=$submission_id" >> "$GITHUB_OUTPUT"
          if [[ $submit_status -ne 0 || "$status" != "Accepted" ]]; then
            xcrun notarytool log "$submission_id" \
              --key "$PKGLIFT_NOTARY_KEY_PATH" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              "$log_path" || true
            [[ ! -f "$log_path" ]] || cat "$log_path"
            echo "Notarization returned status $status (exit $submit_status)." >&2
            exit 1
          fi

      - name: Verify Quarantined CLI
        shell: bash
        run: |
          set -euo pipefail
          assessment_directory="$(mktemp -d)"
          trap 'rm -rf "$assessment_directory"' EXIT
          tar -xzf release/pkglift-macos-arm64.tar.gz -C "$assessment_directory"
          binary_path="$assessment_directory/pkglift"
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");GitHubActions;" "$binary_path"
          codesign --verify --strict --verbose=4 "$binary_path"
          codesign -dvvv "$binary_path" 2> "$assessment_directory/codesign-details.txt"
          cat "$assessment_directory/codesign-details.txt"
          grep -F "Authority=$DEVELOPER_ID_APPLICATION_IDENTITY" "$assessment_directory/codesign-details.txt"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" "$assessment_directory/codesign-details.txt"
          grep -E 'flags=.*runtime' "$assessment_directory/codesign-details.txt"
          grep -E '^Timestamp=' "$assessment_directory/codesign-details.txt"

          set +e
          assessment_output="$(spctl --assess --type execute --verbose=4 "$binary_path" 2>&1)"
          assessment_status=$?
          set -e
          printf '%s\n' "$assessment_output"

          if (( assessment_status == 0 )); then
            grep -F 'source=Notarized Developer ID' <<< "$assessment_output"
          else
            # spctl does not classify a standalone Mach-O command-line tool as
            # an app. Accept only that exact classification after notarytool
            # returned Accepted and the strict signature check passed.
            [[ $assessment_status -eq 3 ]]
            grep -F 'rejected (the code is valid but does not seem to be an app)' <<< "$assessment_output"
          fi

          [[ "$("$binary_path" version)" == "$PKGLIFT_VERSION" ]]
          "$binary_path" registry validate

      - name: Upload Validated Distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkglift-macos-arm64-${{ github.sha }}
          path: |
            release/pkglift-macos-arm64.tar.gz
            release/pkglift-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Notarization Diagnostics
        if: failure() && steps.notarize.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkglift-notarization-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/notary-result.json
            ${{ runner.temp }}/notary-log.json
          if-no-files-found: warn
          retention-days: 14

      - name: Clean Signing Material
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${PKGLIFT_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$PKGLIFT_KEYCHAIN_PATH"
          fi
          rm -f \
            "$RUNNER_TEMP/pkglift-developer-id.p12" \
            "$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"

  publish:
    if: needs.package.outputs.publish_release == 'true'
    needs: package
    runs-on: macos-15
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: Download Validated Distribution
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pkglift-macos-arm64-${{ github.sha }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.package.outputs.release_tag }}
          target_commitish: ${{ needs.package.outputs.target_commitish }}
          name: PkgLift ${{ needs.package.outputs.release_tag }}
          files: |
            release/pkglift-macos-arm64.tar.gz
            release/pkglift-macos-arm64.tar.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.package.outputs.release_tag, '-') }}
