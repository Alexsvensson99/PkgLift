name: Pinned Pilots

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '23 4 * * 2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Positive controlled migration
            case: positive
            issue: '23'
            repository: aws-samples/amazon-ivs-grid-feed-for-ios-demo
            commit: 5573a57d4cb7e10f7ad86f95c548ddfbeabc6e1d
            root: .
            workspace: Grid Feed.xcworkspace
            project: Grid Feed.xcodeproj
            license: MIT-0
          - name: Mixed classifications
            case: mixed
            issue: '24'
            repository: ayseyurek/LoodosCase
            commit: 407b65db02469467b3317ca8dee0d8676c7e673e
            root: .
            workspace: LoodosCase.xcworkspace
            project: LoodosCase.xcodeproj
            license: No license file detected at pinned commit; transient validation only
          - name: Conservative refusal
            case: negative
            issue: '25'
            repository: Finb/V2ex-Swift
            commit: 28ef39d2e5fc11d28bc79743ba2bc5f5594ba170
            root: .
            workspace: V2ex-Swift.xcworkspace
            project: V2ex-Swift.xcodeproj
            license: MIT
          - name: Tinode read-only compatibility
            case: tinode
            issue: local-batch-20260815
            repository: tinode/ios
            commit: a4db1251549c40b7aa4f269cd79234eb4c07baff
            root: .
            workspace: Tinodios.xcworkspace
            project: Tinodios.xcodeproj
            license: Apache-2.0
          - name: XcodeBenchmark read-only compatibility
            case: xcodebenchmark
            issue: '53'
            repository: devMEremenko/XcodeBenchmark
            commit: 60d82d23e34fd63c4cae5d26d10cbdd88f0b0ee2
            root: .
            workspace: XcodeBenchmark.xcworkspace
            project: XcodeBenchmark.xcodeproj
            license: MIT
          - name: Hammerspoon read-only compatibility
            case: hammerspoon
            issue: '53'
            repository: Hammerspoon/hammerspoon
            commit: 23e387e2805a9890066366e0ac96c71b27f0cfd5
            root: .
            workspace: Hammerspoon.xcworkspace
            project: Hammerspoon.xcodeproj
            license: MIT
          - name: AcknowList read-only compatibility
            case: acknowlist
            issue: local-batch-20260815
            repository: vtourraine/AcknowList
            commit: 0288baabb859af22b9e152555fa56b56094de789
            root: Examples/AcknowExampleCocoaPods
            workspace: AcknowExampleCocoaPods.xcworkspace
            project: AcknowExampleCocoaPods.xcodeproj
            license: MIT
          - name: fastlane CocoaPods example
            case: fastlane
            issue: '48'
            repository: fastlane/fastlane
            commit: a9a72554e1f4d6658842d4f3a7b0ca236b5c1589
            root: gym/examples/cocoapods
            workspace: Example.xcworkspace
            project: Example.xcodeproj
            license: MIT
          - name: FirebaseUI Swift example
            case: firebaseui
            issue: '48'
            repository: firebase/FirebaseUI-iOS
            commit: c30af73fee50724dcd9a3acf70548d3e58c86dc7
            root: samples/swift
            workspace: '-'
            project: FirebaseUI-demo-swift.xcodeproj
            license: Apache-2.0
          - name: Firebase Legacy Auth Quickstart
            case: firebaseauth
            issue: '48'
            repository: firebase/snippets-ios
            commit: affc6b838d3dc3382ca741983dad489631d52b43
            root: qs-snippets/LegacyAuthQuickstart
            workspace: '-'
            project: AuthenticationExample.xcodeproj
            license: Apache-2.0
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PILOT_CASE: ${{ matrix.case }}
      PILOT_ISSUE: ${{ matrix.issue }}
      PILOT_REPOSITORY: ${{ matrix.repository }}
      PILOT_COMMIT: ${{ matrix.commit }}
      PILOT_ROOT: ${{ matrix.root }}
      PILOT_WORKSPACE: ${{ matrix.workspace }}
      PILOT_PROJECT: ${{ matrix.project }}
      PILOT_LICENSE: ${{ matrix.license }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build PkgLift
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release -j 2
          bin_directory="$(swift build -c release --show-bin-path)"
          echo "PKGLIFT_BIN=$bin_directory/pkglift" >> "$GITHUB_ENV"

      - name: Run Pinned Pilot
        run: bash Scripts/run-pinned-pilot.sh

      - name: Upload Redacted Pilot Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkglift-pilot-${{ matrix.case }}-${{ github.sha }}
          path: ${{ runner.temp }}/pkglift-pilot-report/${{ matrix.case }}
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: Pinned Pilot Gate
    needs: analyze
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require applicable pinned pilots
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ANALYZE_RESULT" == 'success' ]]
          echo 'All pinned read-only pilots passed.'
