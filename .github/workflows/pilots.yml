name: Pinned Pilots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pilots.yml'
      - 'Scripts/run-pinned-pilot.sh'
      - 'Scripts/validate-pinned-pilot.rb'
      - 'Documentation/Pilots.md'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Registry/**'
      - 'Sources/PkgLiftCLI/**'
      - 'Sources/PkgLiftCore/**'
      - 'Sources/PkgLiftCocoaPods/**'
      - 'Sources/PkgLiftMigration/**'
      - 'Sources/PkgLiftRegistry/**'
      - 'Sources/PkgLiftVerification/**'
      - 'Sources/PkgLiftXcode/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Positive controlled migration
            case: positive
            issue: '23'
            repository: aws-samples/amazon-ivs-grid-feed-for-ios-demo
            commit: 5573a57d4cb7e10f7ad86f95c548ddfbeabc6e1d
            workspace: Grid Feed.xcworkspace
            project: Grid Feed.xcodeproj
            license: MIT-0
          - name: Mixed classifications
            case: mixed
            issue: '24'
            repository: ayseyurek/LoodosCase
            commit: 407b65db02469467b3317ca8dee0d8676c7e673e
            workspace: LoodosCase.xcworkspace
            project: LoodosCase.xcodeproj
            license: No license file detected at pinned commit; transient validation only
          - name: Conservative refusal
            case: negative
            issue: '25'
            repository: Finb/V2ex-Swift
            commit: 28ef39d2e5fc11d28bc79743ba2bc5f5594ba170
            workspace: V2ex-Swift.xcworkspace
            project: V2ex-Swift.xcodeproj
            license: MIT
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PILOT_CASE: ${{ matrix.case }}
      PILOT_ISSUE: ${{ matrix.issue }}
      PILOT_REPOSITORY: ${{ matrix.repository }}
      PILOT_COMMIT: ${{ matrix.commit }}
      PILOT_WORKSPACE: ${{ matrix.workspace }}
      PILOT_PROJECT: ${{ matrix.project }}
      PILOT_LICENSE: ${{ matrix.license }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build PkgLift
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release -j 2
          bin_directory="$(swift build -c release --show-bin-path)"
          echo "PKGLIFT_BIN=$bin_directory/pkglift" >> "$GITHUB_ENV"

      - name: Run Pinned Pilot
        run: bash Scripts/run-pinned-pilot.sh

      - name: Upload Redacted Pilot Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkglift-pilot-${{ matrix.case }}-${{ github.sha }}
          path: ${{ runner.temp }}/pkglift-pilot-report/${{ matrix.case }}
          if-no-files-found: warn
          retention-days: 14
