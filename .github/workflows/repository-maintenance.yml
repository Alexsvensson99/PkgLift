name: Repository maintenance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repository-maintenance.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetShas = new Set([
              "313f5828cdcccdf8517b7ae5a5b38356acfd2b8f",
              "1cd532d5908987afccb29d0b7d2f456a856ccdad",
              "4050bbd5d0b02ed53ffb91783cb0ca6f58c5700c",
            ]);

            for (let page = 1; page <= 10; page += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                per_page: 100,
                page,
              });

              for (const run of data.workflow_runs) {
                if (targetShas.has(run.head_sha) && run.status === "completed") {
                  await github.rest.actions.deleteWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                }
              }

              if (data.workflow_runs.length < 100) break;
            }
